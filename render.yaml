services:
  - type: web
    name: stash-live-engine
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install && npm run build:engine
    startCommand: npm run start:engine
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: STASH_LOCAL
        value: "1"
      # Signed image-proxy URLs are built from imageProxyPublicOrigin. Without
      # this, STASH_LOCAL=1 makes it fall back to http://localhost:5000, so the
      # browser gets an image URL pointing at the user's own machine and no
      # image ever renders.
      - key: STASH_IMAGE_PROXY_ORIGIN
        value: https://stash-live-engine.onrender.com
      - key: STASH_PRODUCT_ORIGIN
        value: https://stashlive.vercel.app
      - key: STASH_AI_PROVIDER
        value: bedrock
      - key: AWS_REGION
        value: us-east-1
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_BEARER_TOKEN_BEDROCK
        sync: false
      - key: BEDROCK_MODEL_ID
        value: qwen.qwen3-32b-v1:0
      # Meeting platform. STUN is enough for permissive networks only; without a
      # TURN relay, participants behind symmetric NAT or a corporate firewall
      # will sit on "Connecting…" forever. Set all three together or none.
      - key: STASH_MEETING_ENABLED
        value: "1"
      - key: STASH_MEETING_MESH_LIMIT
        value: "6"
      - key: STASH_MEETING_STUN_URL
        value: stun:stun.l.google.com:19302,stun:stun1.l.google.com:19302
      - key: STASH_MEETING_TURN_URL
        sync: false
      - key: STASH_MEETING_TURN_USERNAME
        sync: false
      - key: STASH_MEETING_TURN_CREDENTIAL
        sync: false
